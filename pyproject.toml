[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emergency-intelligence-ai"
version = "0.1.0"
description = "Intelligent navigation during emergency situations — Day 1: Local Routing Engine Foundation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["routing", "emergency", "graph", "dijkstra", "navigation", "open-source"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]
# Day 1 has zero runtime dependencies.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["emergency_intelligence"]
branch = true

[tool.coverage.report]
show_missing = true
