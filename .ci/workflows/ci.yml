name: CI Quality Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Development Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run Developer Sanity Verification Script
        run: python scripts/check.py

      - name: Run Pytest Suite with Coverage Enforcement
        run: pytest --cov=emergency_intelligence --cov-report=term-missing --cov-fail-under=90

      - name: Execute All Demonstration Scripts
        run: |
          python examples/demo.py
          python examples/benchmark_demo.py
          python examples/osm_demo.py
          python examples/geojson_export_demo.py
          python examples/architecture_comparison_demo.py

  zero-dependency-audit:
    name: Zero Runtime Dependencies Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pure Package (No Dev Deps)
        run: pip install .

      - name: Audit Installed Packages
        run: |
          # Verify that only pip/setuptools/wheel/emergency-intelligence-ai exist
          pip list
          python -c "import emergency_intelligence; print('Successfully imported with zero external dependencies!')"
